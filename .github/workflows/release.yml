# Builds the Windows installer and publishes it to GitHub Releases.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0)
#
# Output (build/build-installer.ps1): Morfa-<version>-win-Setup.exe (Morfa's own installer, src/Morfa.Installer),
# Morfa-<version>-win-Portable.zip and Morfa-<version>-SHA256SUMS.txt.
# The release is a draft with the Linux and macOS packages: the Windows files are signed on a PC signed in to Certum's
# SimplySign cloud (its key needs a phone token), so this run keeps the tested, unsigned build as the artifact
# windows-unsigned, and build/sign-release.ps1 signs it, packs Setup again, uploads the Windows files and publishes.
# Release notes: the version's section of CHANGELOG.md (what changed, for people using Morfa), then the list GitHub
# generates from the pull requests merged since the previous release, grouped by label (.github/release.yml), with
# their authors and new contributors.
# Large engines are not in the installer; its engine page (or the app, on first run and in Settings > Engines)
# downloads them.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  portable:
    # Only run this workflow on tag pushes, not on pushes that modify the file to the default branch.
    if: ${{ github.ref_type == 'tag' }}
    uses: ./.github/workflows/portable.yml
    with:
      version: ${{ github.ref_name }}

  windows:
    needs: portable
    if: ${{ github.ref_type == 'tag' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Fonts
        shell: pwsh
        run: ./build/fetch-fonts.ps1

      - name: Restore Zig toolchain
        uses: actions/cache/restore@v6
        with:
          path: build/.cache/zig-x86_64-windows-0.16.0
          key: zig-0.16.0-x86_64-windows

      # Windows 11 top-level Explorer menu: MorfaExplorerMenu.dll (C, built with a pinned Zig toolchain) and the
      # unsigned sparse package MorfaExplorerMenu.msix. Built before the tests so they check the real files.
      - name: Build Explorer menu extension
        shell: pwsh
        run: ./build/build-explorer-menu.ps1 -Version ${{ steps.version.outputs.value }}

      # Same engines as CI, so the release runs the same tests (they are not part of the installer).
      - name: Fetch rhwp, Pandoc and 7-Zip for engine tests
        shell: pwsh
        run: ./build/fetch-engines.ps1 -Only rhwp,pandoc,7zip

      # Built first and tested like CI: the UI tests on their own with crash and hang blame (a crash names the
      # running test and leaves a dump in TestResults), then the rest.
      - name: Build
        run: dotnet build Morfa.slnx -c Release

      - name: Test UI on its own
        run: dotnet test tests/Morfa.Desktop.Tests --no-build -c Release --blame-crash --blame-hang-timeout 5m --logger "console;verbosity=normal" --results-directory TestResults/app

      - name: Test
        run: dotnet test Morfa.slnx --no-build -c Release --filter "FullyQualifiedName!~Morfa.Desktop.Tests"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults/
          if-no-files-found: ignore

      # Publishes the app (Release, self-contained, ReadyToRun) with the Explorer menu extension and the bundled rhwp
      # and 7-Zip and the Microsoft C++ runtime, publishes Setup (one self-contained file), appends the app to it as a
      # checked payload and zips the portable copy.
      - name: Build installer and portable zip
        shell: pwsh
        run: ./build/build-installer.ps1 -Version ${{ steps.version.outputs.value }} -Portable

      # The publish folder and the Setup program as tested, for build/sign-release.ps1 (artifacts leave out hidden
      # folders such as build/.cache, so both are moved into one folder first).
      - name: Keep the unsigned Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Move-Item publish/win-x64 unsigned/app
          Copy-Item build/.cache/setup/Morfa.Installer.exe unsigned/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: unsigned/
          if-no-files-found: error
          retention-days: 30

      - name: Download Linux and macOS packages
        uses: actions/download-artifact@v8
        with:
          pattern: portable-*
          merge-multiple: true
          path: Releases

      - name: Draft the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          # Windows packages are unsigned here; the signed build is published with build/sign-release.ps1 on a PC
          # signed in to SimplySign. Linux/macOS packages belong to this draft.
          $files = Get-ChildItem Releases -File -Filter "Morfa-$version-*" | ForEach-Object FullName
          # The release body is generated from CHANGELOG.md and CHANGELOG.id.md by header,
          # and the title is the project name plus the version tag only.
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          # Throws on its own when the changelog is malformed.
          & (Join-Path $PWD 'build/tools/make-release-notes.ps1') -Version $version -Output $notesFile
          gh release create '${{ github.ref_name }}' --draft --title 'Morfa ${{ github.ref_name }}' --notes-file $notesFile --verify-tag @files
